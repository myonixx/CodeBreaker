name: iOS UI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.0.app

    - name: Find and Boot Available Simulator
      id: find_sim
      run: |
        # 1. Wake up simulator control core
        xcrun simctl list devices
        
        # 2. Extract the UDID of the first available booted/bootable iOS simulator
        SIM_UDID=$(xcrun simctl list devices available | grep -m 1 -E "iPhone|SE" | awk -F '[()]' '{print $(NF-1)}')
        
        if [ -z "$SIM_UDID" ]; then
          echo "❌ Error: No available iOS Simulators found on this machine."
          exit 1
        fi
        
        echo "Found Simulator UDID: $SIM_UDID"
        
        # 3. Boot the simulator so it's warm and ready
        xcrun simctl boot "$SIM_UDID" || echo "Simulator already booted"
        
        # 4. Save the UDID as an environment variable for the next step
        echo "UDID=$SIM_UDID" >> $GITHUB_ENV

    - name: Run XCTest UI Tests
      run: |
        xcodebuild test \
          -project CodeBreaker.xcodeproj \
          -scheme CodeBreaker \
          -destination "platform=iOS Simulator,id=${{ env.UDID }}" \
          -only-testing:CodeBreakerUITests \
          -derivedDataPath DerivedData \
          -resultBundlePath TestResults.xcresult

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: xcuitest-results
        path: TestResults.xcresult
